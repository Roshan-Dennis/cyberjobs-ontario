name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pipeline self-test
        run: npm run selftest

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  connectors:
    name: Smoke-test live connectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only on main / manual runs: this hits real third-party APIs.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry-run ingest (no writes)
        run: npm run ingest -- --dry-run --only greenhouse,lever,ashby,jobbank,workday --budget 420000
        env:
          NEXT_TELEMETRY_DISABLED: '1'
