name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pipeline self-test
        run: npm run selftest

      # Compile-and-typecheck build. The static *export* needs a job snapshot to
      # prerender one page per posting, and Next refuses `output: export` when
      # generateStaticParams comes back empty — so exercising that path here
      # would mean either a network call or committed placeholder job data.
      # Neither is worth it: pages.yml runs the real export on every push to
      # main a minute later, and goes red just as loudly if it breaks.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

# The live-connector check lives in pages.yml: every scheduled publish runs a
# real ingest and prints the per-source counts to the run summary, so there is
# no reason to hammer the same third-party APIs a second time from here.
